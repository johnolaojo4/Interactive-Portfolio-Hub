<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../../assets/icons/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../../assets/icons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../../assets/icons/favicon-16x16.png"
    />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Age Calculator | Time Tool</title>
    <link rel="stylesheet" href="../../CSS/calc-style.css" />
  </head>
  <body>
    <header class="calc-header">
      <a href="hub.html" class="back-link">← Back to Hub</a>
      <h1>Age Calculator</h1>
    </header>

    <main class="calc-container">
      <div class="calculator-box age-box">
        <div class="input-group">
          <label>Select Date of Birth</label>
          <input type="date" id="dob-input" />
        </div>

        <button class="btn-main-action" onclick="calculateAge()">
          CALCULATE AGE
        </button>

        <div class="age-result-area">
          <div class="age-unit">
            <span id="years-res">0</span>
            <p>Years</p>
          </div>
          <div class="age-unit">
            <span id="months-res">0</span>
            <p>Months</p>
          </div>
          <div class="age-unit">
            <span id="days-res">0</span>
            <p>Days</p>
          </div>
        </div>
      </div>
    </main>

    <footer>
      <p>
        © 2026 John Ola-ojo |
        <a
          href="https://github.com/johnolaojo4/Interactive-Portfolio-Hub.git"
          target="_blank"
          class="github-link"
          ><img src="/assets/icons/github.png" alt="View on GitHub"
        /></a>
      </p>
    </footer>
    <script src="../../JS/script.js"></script>
    <script src="../../JS/age-script.js"></script>
  </body>
</html>

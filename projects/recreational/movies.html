<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../../assets/icons/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../../assets/icons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../../assets/icons/favicon-16x16.png"
    />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Movie Manager</title>
    <link rel="stylesheet" href="../../CSS/main.css" />
    <link rel="stylesheet" href="../recreational/todo-style.css" />
    <link rel="stylesheet" href="../../CSS/movies.css" />
  </head>
  <body>
    <header class="calc-header">
      <a href="../../index.html" class="back-link">← Home</a>
    </header>

    <main class="todo-theme-wrapper">
      <div class="todo-card-container">
        <h1>MOVIES</h1>

        <ul id="movieList" class="theme-list"></ul>

        <div class="theme-input-group">
          <label>ADD MOVIE & RATING (1-5)</label>
          <div class="input-wrapper">
            <input type="text" id="movieInput" placeholder="Movie title..." />
            <input
              type="number"
              id="ratingInput"
              min="1"
              max="5"
              placeholder="★"
              id="rating-field"
            />
            <button class="add-btn" onclick="addMovie()">+</button>
          </div>
        </div>
      </div>
    </main>
    <footer>
      <p>
        © 2026 John Ola-ojo |
        <a
          href="https://github.com/johnolaojo4/Interactive-Portfolio-Hub.git"
          target="_blank"
          class="github-link"
          ><img src="/assets/icons/github.png" alt="View on GitHub"
        /></a>
      </p>
    </footer>

    <button id="backToTop" class="back-to-top" title="Back to Top">↑</button>

    <script src="../../JS/movies.js"></script>
  </body>
</html>
